name: Smoke Tests

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  service_quality:
    name: Service pytest and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - name: Install service test dependencies
        run: python -m pip install -r requirements.txt -r tests/requirements.txt ruff==0.15.21
      - name: Run service tests
        run: python -m pytest -q
      - name: Run scoped Ruff checks
        run: ruff check service/server.py tests

  klippy_testing:
    name: Klippy Tests (${{ matrix.upstream_name }}, Python ${{ matrix.python_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream_name: Klipper master
            klipper_repo: Klipper3d/klipper
            klipper_version: master
            python_version: '3.9'
          - upstream_name: Klipper master
            klipper_repo: Klipper3d/klipper
            klipper_version: master
            python_version: '3.11'
          - upstream_name: Klipper v0.13.0
            klipper_repo: Klipper3d/klipper
            klipper_version: v0.13.0
            python_version: '3.9'
          - upstream_name: Klipper v0.13.0
            klipper_repo: Klipper3d/klipper
            klipper_version: v0.13.0
            python_version: '3.11'
          - upstream_name: Kalico main
            klipper_repo: KalicoCrew/kalico
            klipper_version: main
            python_version: '3.9'
          - upstream_name: Kalico main
            klipper_repo: KalicoCrew/kalico
            klipper_version: main
            python_version: '3.11'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Checkout shaketune
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          path: shaketune
      - name: Checkout Klipper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          path: klipper
          repository: ${{ matrix.klipper_repo }}
          ref: ${{ matrix.klipper_version }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-avr avr-libc
      - name: Build klipper dict
        run: |
          pushd klipper
          cp ../shaketune/ci/smoke-test/klipper-smoketest.kconfig .config
          make olddefconfig
          make out/compile_time_request.o
          popd
      - name: Setup klippy env
        run: |
          python3 -m venv --prompt klippy klippy-env
          ./klippy-env/bin/python -m pip install -r klipper/scripts/klippy-requirements.txt
          ./klippy-env/bin/python -m pip install -r shaketune/requirements.txt
      - name: Install shaketune
        run: |
          ln -s "$PWD/shaketune/shaketune" "$PWD/klipper/klippy/extras/shaketune"
      - name: Klipper import test
        run: |
          ./klippy-env/bin/python klipper/klippy/klippy.py --import-test
      - name: Klipper integrated test
        run: |
          pushd klipper
          mkdir ../dicts
          cp ../klipper/out/klipper.dict ../dicts/atmega2560.dict
          ../klippy-env/bin/python scripts/test_klippy.py -d ../dicts ../shaketune/ci/smoke-test/klippy-tests/simple.test
