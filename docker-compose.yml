services:
  shaketune:
    image: ${SHAKETUNE_IMAGE:-ghcr.io/caffeineflo/shaketune-service:latest}
    container_name: shaketune-service
    command: ["uvicorn", "service.server:app", "--host", "0.0.0.0", "--port", "8080"]
    init: true
    ports:
      - "3080:8080"
    volumes:
      - /dockerfs/shaketune-results:/app/results
      - ${SHAKETUNE_TOKEN_FILE:-./secrets/api-token}:/run/secrets/shaketune_api_token:ro
    environment:
      TZ: America/New_York
      SHAKETUNE_API_TOKEN_FILE: /run/secrets/shaketune_api_token
      SHAKETUNE_ANALYSIS_CONCURRENCY: "1"
      SHAKETUNE_ANALYSIS_TIMEOUT_SECONDS: "300"
      SHAKETUNE_MAX_REQUEST_BODY_BYTES: "67108864"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.services.shaketune.loadbalancer.server.port=8080
      - traefik.http.routers.shaketune.entrypoints=https
      - traefik.http.routers.shaketune.rule=Host(`shaketune.iflorian.com`)
      - traefik.http.routers.shaketune.tls=true
      - traefik.http.routers.shaketune.tls.certresolver=letsEncrypt
      - traefik.http.routers.shaketune.middlewares=chain-local-only@file
      - traefik.http.routers.shaketune.service=shaketune

networks:
  web:
    external: true
